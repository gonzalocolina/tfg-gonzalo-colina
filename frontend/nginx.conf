server {
    listen 80;
    server_name _;
    charset utf-8;

    location /organizer/ {
        alias /usr/share/nginx/html/organizer/;
        try_files $uri $uri/ /organizer/index.html;
    }

    location /player/ {
        alias /usr/share/nginx/html/player/;
        try_files $uri $uri/ /player/index.html;
    }

    location / {
        root /usr/share/nginx/html/portal;
        try_files $uri $uri/ /index.html;
    }
}
