spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:file:${APP_DATA_DIR:./data}/mc_database;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# H2 embebido en fichero: una sola conexión estable, sin rotación agresiva.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=0
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# Heartbeat cada 60s para mantener H2 activa tras horas sin uso (demos/TFG).
app.database.heartbeat.enabled=true
app.database.heartbeat-interval-ms=60000
# schema.sql aplica migraciones defensivas; update conserva los datos entre reinicios.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.security.jwt.secret=${APP_JWT_SECRET}
app.security.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}
app.realtime.allowed-origins=${APP_ALLOWED_ORIGINS:http://*:*,https://*:*}
app.inter-pod-card.images-dir=${APP_INTER_POD_CARD_IMAGES_DIR:${APP_DATA_DIR:./data}/inter-pod-cards}
app.inter-pod-card.max-image-bytes=${APP_INTER_POD_CARD_MAX_IMAGE_BYTES:5242880}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health
