# Profile "docker" — used inside docker-compose
spring.datasource.url=jdbc:h2:file:/app/data/god_of_lies;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=false

app.security.jwt.secret=${APP_JWT_SECRET:super-secret-docker-key}
app.security.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}
app.realtime.allowed-origins=http://localhost:3000,http://localhost:5173

management.endpoints.web.exposure.include=health
