spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/god_of_lies;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.security.jwt.secret=${APP_JWT_SECRET:change-me-in-local-development}
app.security.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}
app.realtime.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.inter-pod-card.images-dir=${APP_INTER_POD_CARD_IMAGES_DIR:./data/inter-pod-cards}
app.inter-pod-card.max-image-bytes=${APP_INTER_POD_CARD_MAX_IMAGE_BYTES:5242880}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health
